<main>

<section class="gallery-header">
  <h2>🖼 3D Art Gallery</h2>
  <p>Роботи, рендери та сцени з різних стилів</p>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="">
</div>

<section class="gallery-modern">

  <div class="grid">

    <div class="item large">
      <img src="https://images.unsplash.com/photo-1650357935585-66f914bcc4b9" onclick="openLightbox(this)">
      <div class="info">Abstract Render</div>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1645571498966-869875a6520c" onclick="openLightbox(this)">
      <div class="info">Sculpting Study</div>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1617791160536-598cf32026fb" onclick="openLightbox(this)">
      <div class="info">Liquid Metal</div>
    </div>

    <div class="item tall">
      <img src="https://images.unsplash.com/photo-1604079628040-94301bb21b91" onclick="openLightbox(this)">
      <div class="info">3D Environment</div>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead" onclick="openLightbox(this)">
      <div class="info">Geometry Study</div>
    </div>

    <div class="item wide">
      <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f" onclick="openLightbox(this)">
      <div class="info">Blender Scene</div>
    </div>

    <!-- ➕ НОВЕ ФОТО -->
    <div class="item">
      <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&w=1200&q=80" onclick="openLightbox(this)">
      <div class="info">Blender Sci-Fi Render</div>
    </div>

  </div>

</section>
</main>

<footer>
  <p>© 2026 3D Моделювання</p>
</footer>

<script>
function openLightbox(img) {
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = img.src;
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}
</script>
